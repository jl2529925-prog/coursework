openapi: 3.1.0
info:
  title: Personal Finance Information System API
  version: 1.0.0
  description: Versioned REST API backed by CSV and JSON text files.
servers:
  - url: http://127.0.0.1:5000/api/v1
paths:
  /health:
    get:
      summary: Read service health
      responses:
        '200':
          description: Service is available
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthEnvelope' }
  /transactions:
    get:
      summary: List transactions
      parameters:
        - { name: year, in: query, schema: { type: integer, minimum: 2000, maximum: 2100 } }
        - { name: month, in: query, schema: { type: integer, minimum: 1, maximum: 12 } }
        - { name: type, in: query, schema: { type: string, enum: [income, expense] } }
        - { name: category, in: query, schema: { type: string } }
      responses:
        '200':
          description: Matching records, newest first
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Transaction' } }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      summary: Create a transaction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionInput' }
      responses:
        '201':
          description: Created transaction
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Transaction' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /transactions/{transactionId}:
    parameters:
      - { name: transactionId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Read one transaction
      responses:
        '200':
          description: Transaction record
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Transaction' } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update supplied fields of one transaction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionPatch' }
      responses:
        '200':
          description: Updated transaction
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Transaction' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      summary: Delete one transaction
      responses:
        '204': { description: Deleted; no response body }
        '404': { $ref: '#/components/responses/NotFound' }
  /budgets/{year}/{month}:
    parameters:
      - { name: year, in: path, required: true, schema: { type: integer, minimum: 2000, maximum: 2100 } }
      - { name: month, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 12 } }
    get:
      summary: Read a monthly budget
      responses:
        '200':
          description: Budget categories and limits
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Budget' } }
        '422': { $ref: '#/components/responses/ValidationError' }
    put:
      summary: Replace a monthly budget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [limits]
              additionalProperties: false
              properties:
                limits:
                  type: object
                  additionalProperties: { type: number, exclusiveMinimum: 0 }
      responses:
        '200':
          description: Saved budget
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Budget' } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /reports/monthly:
    get:
      summary: Calculate a monthly report and budget status
      parameters:
        - { name: year, in: query, required: true, schema: { type: integer, minimum: 2000, maximum: 2100 } }
        - { name: month, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 12 } }
      responses:
        '200':
          description: Monthly totals, category totals and budget performance
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/MonthlyReport' } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /categories:
    get:
      summary: List default and data-derived categories
      responses:
        '200':
          description: Sorted category strings
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties: { data: { type: array, items: { type: string } } }
components:
  responses:
    ValidationError:
      description: Input or period validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource does not exist
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    SuccessEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta:
          type: object
          required: [timestamp]
          properties: { timestamp: { type: string, format: date-time } }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [validation_error] }
            message: { type: string }
            details: { type: object, additionalProperties: { type: string } }
    HealthEnvelope:
      allOf:
        - { $ref: '#/components/schemas/SuccessEnvelope' }
        - type: object
          properties:
            data:
              type: object
              required: [status, service, version]
              properties:
                status: { const: ok }
                service: { const: personal-finance-api }
                version: { type: string }
    TransactionInput:
      type: object
      additionalProperties: false
      required: [occurred_on, type, category, amount]
      properties:
        occurred_on: { type: string, format: date }
        type: { type: string, enum: [income, expense] }
        category: { type: string, minLength: 1, maxLength: 40 }
        amount: { type: number, exclusiveMinimum: 0 }
        note: { type: string, maxLength: 120, default: '' }
    TransactionPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        occurred_on: { type: string, format: date }
        type: { type: string, enum: [income, expense] }
        category: { type: string, minLength: 1, maxLength: 40 }
        amount: { type: number, exclusiveMinimum: 0 }
        note: { type: string, maxLength: 120 }
    Transaction:
      allOf:
        - { $ref: '#/components/schemas/TransactionInput' }
        - type: object
          required: [id]
          properties: { id: { type: string, format: uuid }, amount: { type: string, pattern: '^\\d+\\.\\d{2}$' } }
    Budget:
      type: object
      required: [period, limits]
      properties:
        period: { type: string, pattern: '^\\d{4}-\\d{2}$' }
        limits: { type: object, additionalProperties: { type: string, pattern: '^\\d+\\.\\d{2}$' } }
    MonthlyReport:
      type: object
      required: [period, income, expense, balance, transaction_count, category_expense, budget]
      properties:
        period: { type: string }
        income: { type: string }
        expense: { type: string }
        balance: { type: string }
        transaction_count: { type: integer }
        category_expense: { type: object, additionalProperties: { type: string } }
        budget: { type: array, items: { type: object } }
